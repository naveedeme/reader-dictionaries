name: Build Dictionary Packs

on:
  workflow_dispatch:
    inputs:
      selection:
        description: "Build group (core, standard, native, bilingual, large, all) or one exact pack id"
        required: true
        default: core
        type: string
      publish:
        description: "Publish a GitHub Release and latest catalog"
        required: true
        default: true
        type: boolean
  schedule:
    - cron: "20 2 1 * *"

permissions:
  contents: read

concurrency:
  group: dictionary-release
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validate configuration
        run: python scripts/validate_config.py
      - name: Resolve build matrix
        id: matrix
        shell: bash
        run: |
          selection="${{ github.event.inputs.selection }}"
          if [[ -z "$selection" ]]; then selection="standard"; fi
          python scripts/list_packs.py --group "$selection" --github-output "$GITHUB_OUTPUT"
      - name: Create release identifiers
        id: release
        shell: bash
        run: |
          version="$(date -u +'%Y.%m.%d').${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=dictionaries-$version" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Show available disk
        run: df -h
      - name: Download source
        run: python scripts/download_source.py --pack "${{ matrix.pack }}" --output "work/${{ matrix.pack }}"
      - name: Build package
        run: python scripts/build_pack.py --pack "${{ matrix.pack }}" --source "work/${{ matrix.pack }}" --output dist --version "${{ needs.prepare.outputs.version }}"
      - name: Validate package
        shell: bash
        run: |
          archive="$(find dist -maxdepth 1 -name '${{ matrix.pack }}-*.zip' -print -quit)"
          python scripts/validate_pack.py "$archive" --config config/dictionaries.yml
      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: dictionary-${{ matrix.pack }}
          path: |
            dist/${{ matrix.pack }}-*.zip
            dist/${{ matrix.pack }}-*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: [prepare, build]
    permissions:
      contents: write
    if: github.event_name == 'schedule' || github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Download built packs
        uses: actions/download-artifact@v8
        with:
          pattern: dictionary-*
          path: release-assets
          merge-multiple: true
      - name: Download previous catalog when available
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release download --pattern catalog.json --output previous-catalog.json; then
            rm -f previous-catalog.json
            echo "No previous catalog found; creating the first catalog."
          fi
      - name: Build merged catalog
        shell: bash
        run: |
          args=(
            --packs release-assets
            --output release-assets/catalog.json
            --repository "$GITHUB_REPOSITORY"
            --release-tag "${{ needs.prepare.outputs.tag }}"
            --config config/dictionaries.yml
            --pages-dir site
          )
          if [[ -f previous-catalog.json ]]; then
            args+=(--previous-catalog previous-catalog.json)
          fi
          python scripts/build_catalog.py "${args[@]}"
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f \( -name '*.zip' -o -name '*.sha256' -o -name 'catalog.json' \) -print | sort)
          gh release create "${{ needs.prepare.outputs.tag }}" "${assets[@]}" \
            --title "Offline Dictionaries ${{ needs.prepare.outputs.version }}" \
            --notes "Automated, validated offline dictionary packages. The Android catalog URL is: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/catalog.json" \
            --latest
      - name: Upload generated catalog as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: catalog-${{ needs.prepare.outputs.version }}
          path: site
          retention-days: 30
